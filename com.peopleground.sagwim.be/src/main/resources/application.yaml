server:
  port: 8080

spring:
  application:
    name: sagwim
  profiles:
    active: ${SPRING_PROFILES_ACTIVE:dev}
  servlet:
    multipart:
      max-file-size: 5MB
      max-request-size: 20MB
  datasource:
    url: jdbc:postgresql://${POSTGRES_HOST:localhost}:${POSTGRES_PORT:5432}/${POSTGRES_DB}
    username: ${POSTGRES_USER}
    password: ${POSTGRES_PASSWORD}
    driver-class-name: org.postgresql.Driver
  jpa:
    defer-datasource-initialization: false
    hibernate:
      ddl-auto: none
    properties:
      hibernate:
        jdbc:
          time_zone: Asia/Seoul
        generate_statistics: true  # Micrometer Hibernate 메트릭 수집 (쿼리 수, 실행 시간 등)
    open-in-view: false
  flyway:
    enabled: true
    # dev: V1 + V2(시드), prod: V1만 실행
    locations: classpath:db/migration
    # 한 마이그레이션 파일 안에서 transactional + non-transactional 문 혼용 허용
    # (예: V23 = CREATE EXTENSION + CREATE INDEX CONCURRENTLY)
    mixed: true
  mail:
    host: smtp.gmail.com
    port: 587
    username: ${MAIL_USERNAME}
    password: ${MAIL_PASSWORD}
    properties:
      mail:
        smtp:
          auth: true
          starttls:
            enable: true
  data:
    redis:
      host: ${REDIS_HOST:localhost}
      port: ${REDIS_PORT:6379}
  cache:
    type: redis

## Spring Boot Actuator - 헬스체크 + Prometheus 메트릭
management:
  endpoints:
    web:
      exposure:
        include: health,prometheus
  endpoint:
    health:
      show-details: never
  metrics:
    tags:
      application: ${spring.application.name}

## logging
logging:
  charset:
    console: UTF-8
  pattern:
    console: "%d{yyyy-MM-dd HH:mm:ss.SSS} ${LOG_LEVEL_PATTERN:%-5p} ${PID} --- [%15.15t] %-40.40logger{39} :%06L : %m%n"
  level:
    root: info
    web: info

## jwt
jwt:
  secret: ${JWT_SECRET}
  expiration: 2592000000  # 30일 (ms)

## Google Maps API
google:
  maps:
    api-key: ${GOOGLE_MAPS_API_KEY}

## 이미지 업로드 설정 + CORS 허용 출처
app:
  image:
    upload-dir: ${IMAGE_UPLOAD_DIR:./uploads/images}
    url-prefix: ${IMAGE_URL_PREFIX:/images}
  cors:
    allowed-origins: ${CORS_ALLOWED_ORIGINS:http://localhost:5173,https://sagwim.com,http://sagwim.com,http://sagwim.duckdns.org}
  log:
    dir: ${LOG_DIR:./logs}
  mobile:
    # 소셜 로그인 브릿지 콜백이 302 로 되돌려보낼 앱 커스텀 스킴 URL.
    # 클라이언트가 보낸 값이 아니라 이 상수만 리다이렉트 대상으로 사용한다 (open redirect 방지).
    oauth-callback-url: ${MOBILE_OAUTH_CALLBACK_URL:sagwim://oauth}
  crypto:
    # userEmail 결정론적 AES-256 암호화 키 (Base64 인코딩된 32바이트)
    # 운영/실배포 환경은 반드시 EMAIL_ENCRYPTION_KEY 환경변수로 진짜 키를 주입한다.
    # 아래 fallback 은 git 에 노출돼도 무해한 "로컬 개발 전용 더미키"다 (실데이터 암호화 금지).
    email-key: ${EMAIL_ENCRYPTION_KEY:MxRugKpYCDEWDa3Qj+ES1g0n3Rqzs+DuiblKHzo1m08=}

## 소셜 로그인 OAuth2
## 환경변수 누락 시 빈 문자열로 폴백하여 컨테이너 부팅 실패를 방지하고,
## OAuth 호출 시점에 OAUTH_PROVIDER_NOT_CONFIGURED(503) 로 명확히 에러를 반환한다.
oauth2:
  kakao:
    client-id: ${KAKAO_CLIENT_ID:}
    client-secret: ${KAKAO_CLIENT_SECRET:}
  google:
    client-id: ${GOOGLE_CLIENT_ID:}
    client-secret: ${GOOGLE_CLIENT_SECRET:}
